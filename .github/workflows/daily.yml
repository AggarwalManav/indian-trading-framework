name: Daily NSE screen

# Runs after the NSE close + bhavcopy publication.
# NSE closes 15:30 IST; the UDiFF bhavcopy is usually up by ~7-8pm IST.
# 14:30 UTC = 20:00 IST, Mon-Fri. (Indian market holidays: the job simply finds
# no new bhavcopy and reuses the committed cache — it won't fail.)
on:
  schedule:
    - cron: "30 14 * * 1-5"
  workflow_dispatch: {}        # lets you trigger a refresh manually from the Actions tab

permissions:
  contents: write              # to commit the refreshed data back to the repo

concurrency:                   # never overlap two refreshes
  group: daily-screen
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the daily screen
        run: python data_fetch.py

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/screener.db data/*.csv data/cache/bhav/*.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Daily screen refresh"
            git push
          fi
